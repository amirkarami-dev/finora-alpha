# Finora — one stack for all three deployables, deployed to /data/apps/metal-erp.
#
# Replaces the two separate stacks that used to live at /data/apps/metal-erp (SPA only) and
# /data/apps/metal-uae (corporate site). Both hosts keep their existing names and routers, so
# the consolidation is invisible from outside.
#
# Attaches to the existing external `traefik` network. Cloudflare proxies every domain
# (SSL mode "Full") and Traefik terminates TLS with `tls=true`. We do NOT use the `myresolver`
# ACME resolver: it runs the DNS-01 challenge against ArvanCloud DNS, which is not
# authoritative for these Cloudflare-hosted zones.
#
# Every image is built from the REPO ROOT context, after building the apps locally:
#     npm run build          # both frontends
#     docker compose -f deploy/docker-compose.yml build
services:
  # ── ERP panel — erp.metal-uae.com ────────────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: deploy/erp-panel/Dockerfile
    image: metal-erp-web:latest
    container_name: metal-erp-web
    restart: unless-stopped
    networks: [traefik]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.metal-erp.entrypoints=websecure"
      - "traefik.http.routers.metal-erp.rule=Host(`erp.metal-uae.com`)"
      - "traefik.http.routers.metal-erp.tls=true"
      - "traefik.http.services.metal-erp.loadbalancer.server.port=80"

  # ── Corporate site — metal-uae.com ───────────────────────────────────────────────
  land:
    build:
      context: ..
      dockerfile: deploy/land-web/Dockerfile
    image: metal-uae-web:latest
    container_name: metal-uae-web
    restart: unless-stopped
    networks: [traefik]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.metal-uae.entrypoints=websecure"
      - "traefik.http.routers.metal-uae.rule=Host(`metal-uae.com`)"
      - "traefik.http.routers.metal-uae.tls=true"
      - "traefik.http.services.metal-uae.loadbalancer.server.port=3000"
      # www -> root (301), handled at the origin so it works regardless of any Cloudflare
      # redirect rule. $$ escapes compose interpolation -> Traefik ${1}.
      - "traefik.http.routers.metal-uae-www.entrypoints=websecure"
      - "traefik.http.routers.metal-uae-www.rule=Host(`www.metal-uae.com`)"
      - "traefik.http.routers.metal-uae-www.tls=true"
      - "traefik.http.routers.metal-uae-www.service=metal-uae"
      - "traefik.http.routers.metal-uae-www.middlewares=metal-uae-wwwredir"
      - "traefik.http.middlewares.metal-uae-wwwredir.redirectregex.regex=^https?://www\\.metal-uae\\.com/(.*)"
      - "traefik.http.middlewares.metal-uae-wwwredir.redirectregex.replacement=https://metal-uae.com/$${1}"
      - "traefik.http.middlewares.metal-uae-wwwredir.redirectregex.permanent=true"

  # ── API — api.metal-uae.com ──────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
      target: api
    image: metal-erp-api:latest
    container_name: metal-erp-api
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      # The Postgres container already on this box, reachable by its container name. The
      # password is supplied from the host environment, never committed.
      ConnectionStrings__finora: "Host=postgres;Port=5432;Database=finora;Username=postgres;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      ASPNETCORE_ENVIRONMENT: Production
    networks: [traefik, postgres]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.metal-erp-api.entrypoints=websecure"
      - "traefik.http.routers.metal-erp-api.rule=Host(`api.metal-uae.com`)"
      - "traefik.http.routers.metal-erp-api.tls=true"
      - "traefik.http.services.metal-erp-api.loadbalancer.server.port=8080"

  # Runs pending migrations and exits. The API waits for it to succeed, so no replica ever
  # serves traffic against a schema it does not match.
  migrator:
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
      target: migrator
    image: metal-erp-migrator:latest
    container_name: metal-erp-migrator
    restart: "no"
    environment:
      ConnectionStrings__finora: "Host=postgres;Port=5432;Database=finora;Username=postgres;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    networks: [postgres]

networks:
  traefik:
    external: true
  # The network the existing `postgres` container is on. Declared external so this stack
  # attaches to it rather than creating a second, isolated one.
  postgres:
    external: true
    name: ${POSTGRES_NETWORK:-postgres_default}
